[package]
name = "warpgate-core"
version.workspace = true
edition.workspace = true

[dependencies]
chrono.workspace = true
taskchampion = { version = "3.1", default-features = false, features = ["bundled", "storage-sqlite", "server-sync", "tls-native-roots"] }

[dev-dependencies]
chrono-tz = "0.10.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

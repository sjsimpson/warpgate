[package]
name = "warpgate"
version = "0.1.0-alpha.1"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
chrono = { version = "0.4", features = ["serde"] }
